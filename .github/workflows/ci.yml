name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Export Supabase env
        run: |
          npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      - name: Database tests (pgTAP)
        run: npx supabase test db
      - run: npm run test:integration -- --passWithNoTests
        env:
          REQUIRE_SUPABASE: "1"
      - run: npm run test:security
        env:
          REQUIRE_SUPABASE: "1"
      - run: npm audit --audit-level=high
